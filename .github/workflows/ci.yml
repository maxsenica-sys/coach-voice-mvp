name: CI

# The project pushes straight to main with no tests and no staging, so this is
# the only automated gate between an edit and production. It runs the same two
# checks CLAUDE.md asks for by hand — typecheck and a real production build —
# plus lint, so a broken build is caught before Vercel deploys it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking, as of 2026-09-09. It was advisory for as long as there was a
      # backlog to excuse — 135 errors, then 31 — and a gate that is always red
      # cannot fail a bad commit, which is part of how the #9BA29B contrast
      # regression got in. The backlog is now zero, so the excuse is gone.
      #
      # Warnings are deliberately not fatal: eslint exits non-zero on errors
      # only, and turning 32 unused-import warnings into a merge blocker would
      # recreate exactly the backlog that made this advisory in the first place.
      - name: Lint
        run: npm run lint

      # The rigs below are fast, need no browser and no network, and each one
      # exists because a bug of that class already shipped green. They run
      # before the build so a safeguarding or clock failure is reported in
      # seconds rather than behind two minutes of compilation.
      #
      # These are hard gates, unlike lint. They have no backlog to excuse.
      - name: Safeguarding rules
        run: npm run verify:safeguard

      # Runs the app's real date logic under nine timezones. Note that this job
      # runs in UTC, which is exactly why it is needed: the DST bucketing bug
      # this rig was written for passed in UTC and failed in six other zones.
      - name: Clock rig
        run: npm run verify:clock

      - name: Prompt rig
        run: npm run verify:prompt

      # Month navigation. The calendar shipped a bug where every arrow press
      # unmounted the grid and threw away the month it had just set, so the
      # events belonged to one month and the grid drew another — and typecheck,
      # lint and build all passed on it, before and after. This walks the real
      # month model and asserts the two structural facts the bug rested on:
      # that Calendar owns no month state, and that no host renders it behind a
      # loading conditional.
      - name: Calendar rig
        run: npm run verify:calendar

      # Contrast, recomputed from globals.css rather than read out of the
      # comments next to it. Every ratio in that file is a comment, and comments
      # do not fail: the primary button had been failing AA across half its
      # gradient at 35 call sites, under a token whose own comment recorded the
      # passing ratio for the other end. This rig found three more the same way
      # — the athlete's primary button at 3.65:1 and --energy at 3.17:1 — and it
      # pins the wellness scale's lightness ordering, which is what makes it
      # survive colour blindness and a phone screen in sunlight.
      - name: Palette rig
        run: npm run verify:palette

      # One definition of an "active" athlete, and every route that puts someone
      # on a roster. Leo Bridgeford signed himself up, typed his coach's code
      # into his own portal, and read PENDING on the roster for three days: the
      # route that created his row wrote invited_at and nothing else, and the
      # portal's activate call fires from a load effect that had already run
      # before the row existed. Every file involved type-checked. The defect was
      # in the join between them, which is the shape this rig is for.
      - name: Roster rig
        run: npm run verify:roster

      # Max asked for the type floor so the app is readable on a touchline and
      # by a parent over a shoulder, not only at a desk. A size is just a number
      # to tsc, eslint and next build, so nothing else would catch a new 11px
      # label. The rig is a ratchet: the count may only go down.
      - name: Type floor
        run: npm run verify:type

      # The body map is how an athlete says where it hurts, one-handed and
      # sore. Its numbers are viewBox units, not pixels, so the authored size
      # understates the real tap target by the scale factor — the achilles read
      # 13 and rendered 20.8px, under the WCAG 2.5.8 floor. A target too small
      # does not fail loudly; it marks the wrong body part.
      - name: Body map tap targets
        run: npm run verify:bodymap

      # The cold-start montage is generated from the app's own artwork. A stale
      # sprite is an opening animation quietly showing something other than what
      # the app ships, and a drifted colour is a flash-safety regression in front
      # of thirteen-year-olds. Neither is visible in a diff.
      - name: Montage sprite is in step with the artwork
        run: npm run verify:sprite

      # `next build` prerenders /athlete, which constructs a Supabase client at
      # module scope and throws without these. They are placeholders — the build
      # never makes a network call — so no real secrets belong in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          OPENAI_API_KEY: placeholder-openai-key

      - name: Install Chromium for the boot smoke test
        run: npx playwright install --with-deps chromium

      # The gate the other three cannot be. Typecheck, lint and build all pass
      # on a wordmark that flashes before the intro, on a stylesheet whose fonts
      # the build silently dropped, and on a boot script whose route match never
      # matched — every one of which shipped. This drives a real browser against
      # the build above and asserts on what the first second looks like.
      # Reuses the .next produced by the Build step rather than rebuilding.
      - name: Boot smoke test
        run: npm run verify:boot
