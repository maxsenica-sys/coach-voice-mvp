name: CI

# The project pushes straight to main with no tests and no staging, so this is
# the only automated gate between an edit and production. It runs the same two
# checks CLAUDE.md asks for by hand — typecheck and a real production build —
# plus lint, so a broken build is caught before Vercel deploys it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Advisory only. The repo has ~1100 pre-existing lint errors (mostly
      # no-explicit-any and unescaped entities) that predate this workflow, so
      # a hard gate would fail every push and get ignored. Blocking on it is
      # worth doing once that backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # `next build` prerenders /athlete, which constructs a Supabase client at
      # module scope and throws without these. They are placeholders — the build
      # never makes a network call — so no real secrets belong in CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          OPENAI_API_KEY: placeholder-openai-key

      - name: Install Chromium for the boot smoke test
        run: npx playwright install --with-deps chromium

      # The gate the other three cannot be. Typecheck, lint and build all pass
      # on a wordmark that flashes before the intro, on a stylesheet whose fonts
      # the build silently dropped, and on a boot script whose route match never
      # matched — every one of which shipped. This drives a real browser against
      # the build above and asserts on what the first second looks like.
      # Reuses the .next produced by the Build step rather than rebuilding.
      - name: Boot smoke test
        run: npm run verify:boot
